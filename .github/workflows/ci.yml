name: CI

# Runs the unit tests (condition matching, the fraud checks, the user-agent
# parser, the config schema) on every push. They need no database.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml points CC/AR at a Windows dev machine's toolchain; cargo's
  # [env] never overrides a variable already set, so the runner's own win.
  CC: cc
  AR: ar

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --no-fail-fast
